apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emergency-ops-ingress
spec:
  rules:
    - host: emergency-operations.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emergency-ops-backend
                port:
                  number: 3000
