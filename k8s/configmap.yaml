# Progetto: Emergency Operations  ·  Team: Emergency Operations  ·  Data: 21/10/2026  ·  v0.1
#
# Parametri NON sensibili del componente: URL, porte interne, flag, livelli
# di log. Se un valore è una password, un token o una chiave, non appartiene
# qui: va nel Secret (secret-example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  # Parametri di configurazione runtime dell'applicazione backend
  PORT: "3000"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  POSTGRES_DB: "segnalazioni"
  NODE_ENV: "production"
  LOG_LEVEL: "info"

# Checklist:
# [x] nessun valore qui è una credenziale o un segreto (va nel Secret)
# [x] i nomi delle chiavi sono quelli che il codice del componente si aspetta
#     come variabili d'ambiente
# [x] dopo ogni modifica, ricordate 'kubectl apply' — il cluster non si
#     accorge da solo di un file cambiato sul disco