# Progetto: Emergency Operations  ·  Team: Emergency Operations  ·  Data: 21/10/2026  ·  v0.1
#
# ATTENZIONE: questo file va nel repository con valori DI ESEMPIO, non con le
# credenziali reali che usate a lezione. Un Secret Kubernetes non è cifrato
# di default: è solo codificato in base64. Non è un motivo per versionarlo
# con dati veri su Git — è comunque leggibile da chiunque abbia accesso al
# cluster o al manifest.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  # Credenziali di esempio per la connessione al database PostgreSQL
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "cambiami-in-produzione"

# Checklist:
# [x] i valori in questo file, così come li consegnate, NON sono quelli usati
#     davvero a lezione (sono placeholder o valori di esempio)
# [x] il Deployment collega questo Secret con envFrom → secretRef
# [x] se il vostro repository ha un file .env o simile con le credenziali
#     reali, è nel .gitignore, non committato