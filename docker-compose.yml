services:
  db:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      # dati del database: restano anche dopo "docker compose down"
      - pgdata:/var/lib/postgresql/data
      # schema + dati di prova: eseguito AUTOMATICAMENTE al primo avvio
      # (solo quando il volume pgdata e vuoto)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # il container risulta "healthy" solo quando PostgreSQL accetta connessioni
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
