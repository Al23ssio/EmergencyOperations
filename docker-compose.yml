services:
  db:
    image: postgres:16
    env_file:
      - ${ENV_FILE:-config/dev.env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: localhost:32000/emergency-operations-backend:1.0.0
    build: .
    env_file:
      - ${ENV_FILE:-config/dev.env}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: