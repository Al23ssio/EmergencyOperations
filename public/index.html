<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Operations - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <h1>Emergency Operations</h1>
    <div class="system-status">
      <span class="status-badge" id="server-status">Server: Checking...</span>
      <span class="status-badge" id="db-status">DB: Checking...</span>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="card-header">
        <h2>Nuova Segnalazione</h2>
      </div>
      <form id="form-segnalazione" class="form-grid">
        <div class="form-group">
          <label for="descrizione">Descrizione</label>
          <input type="text" id="descrizione" name="descrizione" placeholder="es. Albero caduto in strada" required>
        </div>
        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria" required>
            <option value="viabilita">Viabilità</option>
            <option value="incendio">Incendio</option>
            <option value="allagamento">Allagamento</option>
            <option value="altro">Altro</option>
          </select>
        </div>
        <div class="form-group">
          <label for="priorita">Priorità</label>
          <select id="priorita" name="priorita" required>
            <option value="bassa">Bassa</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Invia Segnalazione</button>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Lista Segnalazioni</h2>
        <button id="btn-refresh" class="btn btn-secondary">🔄 Aggiorna</button>
      </div>
      <div id="lista-container">
        <p class="loading">Caricamento segnalazioni in corso...</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
