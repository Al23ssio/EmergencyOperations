<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Operations - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">
      <h1>Emergency Operations</h1>
      <div class="system-status">
        <span class="status-badge" id="server-status">Server: Checking...</span>
        <span class="status-badge" id="db-status">DB: Checking...</span>
      </div>
    </div>

    <!-- Stato Utente / Login nella Navbar -->
    <div class="navbar-auth">
      <div id="auth-guest-view" class="auth-controls">
        <span class="auth-guest-label">Ospite (sola lettura)</span>
        <button type="button" id="btn-open-login" class="btn btn-secondary btn-sm">Accedi</button>
      </div>

      <div id="auth-user-view" class="auth-controls hidden">
        <span class="user-info">
          <strong id="current-user-name">-</strong>
          <span id="current-user-role" class="role-badge">-</span>
        </span>
        <button type="button" id="btn-logout" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </div>
  </header>

  <!-- BANNER GLOBALE PER ERRORI DI PERMESSO (403 Forbidden) -->
  <div id="rbac-alert" class="rbac-alert hidden" role="alert">
    <span id="rbac-alert-message">Permessi insufficienti per eseguire questa operazione.</span>
    <button type="button" id="btn-close-rbac-alert" aria-label="Chiudi">&times;</button>
  </div>

  <!-- MODALE DI LOGIN -->
  <div id="login-modal" class="auth-modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="auth-modal-card">
      <div class="auth-modal-header">
        <h2 id="login-title">Accesso Operativo</h2>
        <button type="button" id="btn-close-login" class="btn-close-modal" aria-label="Chiudi">&times;</button>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-identifier">Email o Username *</label>
          <input type="text" id="login-identifier" name="identifier" required autocomplete="username" placeholder="es. mrossi o mario.rossi@ente.it">
        </div>

        <div class="form-group">
          <label for="login-password">Password *</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <div id="login-error-box" class="login-error hidden" role="alert"></div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary full-width">
          Entra nel sistema
        </button>
      </form>
    </div>
  </div>

  <main class="container">
    <!-- FORM DI INSERIMENTO COMPLETO (visibile SOLO dopo il Login) -->
    <section id="card-nuova-segnalazione" class="card hidden">
      <div class="card-header">
        <h2>Nuova Segnalazione Completa</h2>
        <span id="form-auth-hint" class="sub-text"></span>
      </div>
      <form id="form-segnalazione" class="form-grid">
        <div class="form-group full-width">
          <label for="titolo">Titolo *</label>
          <input type="text" id="titolo" name="titolo" placeholder="es. Albero caduto in strada" required>
        </div>

        <div class="form-group full-width">
          <label for="descrizione">Descrizione</label>
          <input type="text" id="descrizione" name="descrizione" placeholder="es. Ostruisce la carreggiata principale vicina al civico 12">
        </div>

        <div class="form-group">
          <label for="indirizzo">Indirizzo</label>
          <input type="text" id="indirizzo" name="indirizzo" placeholder="es. Via Roma 45">
        </div>

        <div class="form-group">
          <label for="latitudine">Latitudine</label>
          <input type="number" step="0.000001" id="latitudine" name="latitudine" placeholder="es. 45.890123" min="-90" max="90">
        </div>

        <div class="form-group">
          <label for="longitudine">Longitudine</label>
          <input type="number" step="0.000001" id="longitudine" name="longitudine" placeholder="es. 11.040123" min="-180" max="180">
        </div>

        <div class="form-group">
          <label for="id_area">Area *</label>
          <select id="id_area" name="id_area" required>
            <option value="1">Centro</option>
            <option value="2">Periferia Nord</option>
            <option value="3">Periferia Sud</option>
            <option value="4">Zona Industriale / Est</option>
            <option value="5">Frazioni collinari / Ovest</option>
            <option value="6">A22 / Rete Viaria Principale</option>
          </select>
        </div>

        <div class="form-group">
          <label for="id_categoria">Categoria</label>
          <select id="id_categoria" name="id_categoria">
            <option value="1">Viabilità</option>
            <option value="2">Dissesto</option>
            <option value="3">Allagamento</option>
            <option value="4" selected>Albero caduto</option>
            <option value="5">Incendio</option>
            <option value="6">Guasto</option>
          </select>
        </div>

        <div class="form-group">
          <label for="canale">Canale di Ricezione</label>
          <select id="canale" name="canale">
            <option value="web" selected>Web</option>
            <option value="telefono">Telefono</option>
            <option value="email">Email</option>
            <option value="altro">Altro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priorita">Priorità *</label>
          <select id="priorita" name="priorita" required>
            <option value="bassa">Bassa</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
            <option value="urgente">Urgente</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary full-width">Invia Segnalazione</button>
      </form>
    </section>

    <!-- TABELLA VISUALIZZAZIONE DETTAGLIATA (sempre visibile) -->
    <section class="card">
      <div class="card-header">
        <h2>Registro Segnalazioni</h2>
        <button id="btn-refresh" class="btn btn-secondary">🔄 Aggiorna</button>
      </div>
      <div id="lista-container" class="table-responsive">
        <p class="loading">Caricamento segnalazioni in corso...</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
