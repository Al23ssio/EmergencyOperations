<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Operations - Territorio Sicuro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Territorio Sicuro - Gestione Segnalazioni</h1>

  <h2>Segnalazioni Inserite</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Descrizione</th>
        <th>Categoria</th>
        <th>Priorità</th>
        <th>Stato</th>
      </tr>
    </thead>
    <tbody id="segnalazioni-list">
      <tr>
        <td colspan="5">Caricamento in corso...</td>
      </tr>
    </tbody>
  </table>

  <h2>Nuova Segnalazione</h2>
  <form id="form-segnalazione">
    <div class="form-group">
      <label for="descrizione">Descrizione:</label>
      <textarea id="descrizione" name="descrizione" required></textarea>
    </div>
    <div class="form-group">
      <label for="categoria">Categoria:</label>
      <input type="text" id="categoria" name="categoria" placeholder="es. viabilità, allagamento" required>
    </div>
    <div class="form-group">
      <label for="priorita">Priorità:</label>
      <select id="priorita" name="priorita">
        <option value="bassa">Bassa</option>
        <option value="media" selected>Media</option>
        <option value="alta">Alta</option>
      </select>
    </div>
    <button type="submit">Invia Segnalazione</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
